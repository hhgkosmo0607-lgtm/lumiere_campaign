<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campaign Insight</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');

:root {
  --ink: #14181f;
  --ink-2: #5a636e;
  --ink-3: #949da8;
  --ground: #eceef1;
  --surface: #ffffff;
  --line: #dce1e6;
  --line-soft: #e9edf0;
  --naver: #14705c;
  --meta: #a54a76;
  --google: #b8801a;
  --breakeven: #c0392b;
  --radius: 3px;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--ground);
  color: var(--ink);
  font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.num {
  font-family: 'IBM Plex Mono', monospace;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

/* 용어 설명 툴팁: 마우스를 올리면 뜻이 뜬다 */
.term {
  position: relative;
  border-bottom: 1px dotted var(--ink-3);
  cursor: help;
}
.term::after {
  content: attr(data-tip);
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-bottom: 6px;
  width: max-content;
  max-width: 220px;
  background: var(--ink);
  color: #fff;
  padding: 8px 10px;
  border-radius: 0;
  font-family: 'IBM Plex Sans KR', sans-serif;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
  line-height: 1.5;
  text-align: left;
  white-space: normal;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s;
  z-index: 30;
}
.term:hover::after {
  opacity: 1;
}
/* 표 헤더는 위로 띄우면 .table-wrap의 overflow-x: auto에 가려 안 보인다. 아래로 띄운다. */
.term--below::after {
  bottom: auto;
  top: 100%;
  margin-bottom: 0;
  margin-top: 6px;
}

.shell {
  max-width: 1080px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

/* ---------- header ---------- */
.masthead {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--ink);
}
.wordmark {
  font-family: 'Bodoni Moda', serif;
  font-size: 30px;
  font-weight: 400;
  letter-spacing: 0.16em;
  line-height: 1;
  margin: 0 0 8px;
}
.masthead-meta {
  font-size: 11px;
  color: var(--ink-2);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin: 0;
}
.masthead-meta span { color: var(--ink-3); }

/* ---------- 조건·요약 카드 상단 고정 ---------- */
.sticky-top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--ground);
  border-bottom: 1px solid var(--line);
}

/* ---------- controls ---------- */
.controls {
  display: flex;
  align-items: flex-end;
  gap: 26px;
  flex-wrap: wrap;
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: none;
  padding: 16px 20px;
}
.control {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.control > label {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.range-readout {
  font-size: 12px;
  letter-spacing: 0;
  color: var(--ink);
  text-transform: none;
}
.control select {
  font-family: 'IBM Plex Sans KR', sans-serif;
  font-size: 13px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px 12px;
  min-width: 118px;
  cursor: pointer;
}
.control select:focus-visible,
.ghost:focus-visible,
.sort-btn:focus-visible,
.range input:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

.range-control { flex: 1 1 220px; min-width: 200px; }
.preset-control, .action-control { flex-direction: row; gap: 6px; align-items: center; }

.ghost {
  font-family: 'IBM Plex Sans KR', sans-serif;
  font-size: 12px;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px 12px;
  cursor: pointer;
}
.ghost:hover:not(:disabled) { border-color: var(--ink-3); color: var(--ink); }
.ghost.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.ghost:disabled { opacity: 0.4; cursor: default; }

/* dual range slider */
.range { position: relative; height: 22px; }
.range-track, .range-fill {
  position: absolute;
  top: 10px;
  height: 2px;
  pointer-events: none;
}
.range-track { left: 0; right: 0; background: var(--line); }
.range-fill { background: var(--ink); }

.range input[type='range'] {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 22px;
  margin: 0;
  background: none;
  -webkit-appearance: none;
  appearance: none;
  pointer-events: none;
}
.range input[type='range']::-webkit-slider-thumb {
  -webkit-appearance: none;
  pointer-events: auto;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--ink);
  cursor: grab;
}
.range input[type='range']::-moz-range-thumb {
  pointer-events: auto;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--ink);
  cursor: grab;
}
.range input[type='range']::-moz-range-track { background: none; }

/* ---------- section label ---------- */
.eyebrow {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.eyebrow::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}

/* ---------- cards ---------- */
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-top: none;
  margin: 0 0 40px;
}
.card {
  background: var(--surface);
  padding: 22px 20px 20px;
}
.card-label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-2);
  margin: 0 0 12px;
}
.card-value {
  font-size: 30px;
  font-weight: 500;
  line-height: 1;
  margin: 0;
}
.card-value .unit {
  font-size: 15px;
  color: var(--ink-2);
  margin-left: 3px;
}
.card-sub {
  font-size: 12px;
  color: var(--ink-3);
  margin: 10px 0 0;
}

/* ---------- panels ---------- */
.panels {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  margin-bottom: 40px;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 22px 20px;
}
.panel h2 {
  font-size: 14px;
  font-weight: 600;
  margin: 0 0 4px;
}
.panel p.hint {
  font-size: 12px;
  color: var(--ink-3);
  margin: 0 0 18px;
}

/* ---------- legend ---------- */
.legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 14px;
  font-size: 12px;
  color: var(--ink-2);
}
.legend i {
  display: inline-block;
  width: 14px;
  height: 2px;
  margin-right: 6px;
  vertical-align: middle;
}

/* ---------- table ---------- */
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--line);
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  white-space: nowrap;
}
thead th {
  text-align: right;
  padding: 0;
  border-bottom: 1px solid var(--ink);
  background: var(--surface);
}
thead th.left { text-align: left; }

.sort-btn {
  width: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  font-family: 'IBM Plex Sans KR', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-2);
  background: none;
  border: none;
  padding: 12px 14px;
  cursor: pointer;
}
thead th.left .sort-btn { justify-content: flex-start; }
.sort-btn:hover { color: var(--ink); }
.caret {
  font-size: 7px;
  line-height: 1;
  opacity: 0;
  transition: opacity 0.12s;
}
.caret.on { opacity: 1; color: var(--ink); }
.sort-btn:hover .caret { opacity: 0.45; }
.sort-btn:hover .caret.on { opacity: 1; }
tbody td {
  padding: 10px 14px;
  text-align: right;
  border-bottom: 1px solid var(--line-soft);
}
tbody td:first-child, tbody td:nth-child(2) { text-align: left; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #f7f9fa; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}
.chip i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}
.pos { color: var(--naver); }
.neg { color: var(--breakeven); }

/* ---------- takeaway ---------- */
.takeaway {
  margin-top: 40px;
  border-top: 1px solid var(--ink);
  padding-top: 22px;
}
.takeaway ol {
  margin: 0;
  padding-left: 0;
  list-style: none;
  display: grid;
  gap: 14px;
}
.takeaway li {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 12px;
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.65;
}
.takeaway li b {
  color: var(--ink);
  font-weight: 600;
}
.takeaway .idx {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--ink-3);
  padding-top: 2px;
}

.footnote {
  margin-top: 32px;
  font-size: 11px;
  color: var(--ink-3);
  line-height: 1.7;
}

.state {
  padding: 60px 20px;
  text-align: center;
  color: var(--ink-2);
  font-size: 13px;
}

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .cards { grid-template-columns: 1fr; }
  .shell { padding: 28px 16px 60px; }
  .wordmark { font-size: 24px; }
  .controls { gap: 16px; }
  .control, .range-control { flex: 1 1 100%; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<div id="root"><div class="state">데이터를 불러오는 중…</div></div>

<script>
const RAW = [{"week":1,"date":"2026-06-01","platform":"naver","adSpend":500000,"impressions":62000,"clicks":1180,"conversions":53,"revenue":2120000},{"week":2,"date":"2026-06-08","platform":"naver","adSpend":550000,"impressions":68000,"clicks":1320,"conversions":61,"revenue":2440000},{"week":3,"date":"2026-06-15","platform":"naver","adSpend":600000,"impressions":74000,"clicks":1450,"conversions":68,"revenue":2720000},{"week":4,"date":"2026-06-22","platform":"naver","adSpend":650000,"impressions":80000,"clicks":1590,"conversions":76,"revenue":3040000},{"week":5,"date":"2026-06-29","platform":"naver","adSpend":700000,"impressions":86000,"clicks":1730,"conversions":84,"revenue":3360000},{"week":6,"date":"2026-07-06","platform":"naver","adSpend":780000,"impressions":94000,"clicks":1910,"conversions":94,"revenue":3760000},{"week":7,"date":"2026-07-13","platform":"naver","adSpend":850000,"impressions":101000,"clicks":2070,"conversions":103,"revenue":4120000},{"week":8,"date":"2026-07-20","platform":"naver","adSpend":900000,"impressions":107000,"clicks":2210,"conversions":112,"revenue":4480000},{"week":1,"date":"2026-06-01","platform":"meta","adSpend":800000,"impressions":90000,"clicks":3240,"conversions":42,"revenue":1680000},{"week":2,"date":"2026-06-08","platform":"meta","adSpend":850000,"impressions":96000,"clicks":3460,"conversions":45,"revenue":1800000},{"week":3,"date":"2026-06-15","platform":"meta","adSpend":900000,"impressions":102000,"clicks":3600,"conversions":46,"revenue":1840000},{"week":4,"date":"2026-06-22","platform":"meta","adSpend":950000,"impressions":110000,"clicks":3780,"conversions":47,"revenue":1880000},{"week":5,"date":"2026-06-29","platform":"meta","adSpend":1000000,"impressions":118000,"clicks":3900,"conversions":47,"revenue":1880000},{"week":6,"date":"2026-07-06","platform":"meta","adSpend":1050000,"impressions":126000,"clicks":4000,"conversions":46,"revenue":1840000},{"week":7,"date":"2026-07-13","platform":"meta","adSpend":1100000,"impressions":134000,"clicks":4080,"conversions":45,"revenue":1800000},{"week":8,"date":"2026-07-20","platform":"meta","adSpend":1150000,"impressions":142000,"clicks":4120,"conversions":43,"revenue":1720000},{"week":1,"date":"2026-06-01","platform":"google","adSpend":400000,"impressions":150000,"clicks":1200,"conversions":15,"revenue":600000},{"week":2,"date":"2026-06-08","platform":"google","adSpend":450000,"impressions":165000,"clicks":1380,"conversions":19,"revenue":760000},{"week":3,"date":"2026-06-15","platform":"google","adSpend":500000,"impressions":180000,"clicks":1550,"conversions":23,"revenue":920000},{"week":4,"date":"2026-06-22","platform":"google","adSpend":550000,"impressions":196000,"clicks":1740,"conversions":28,"revenue":1120000},{"week":5,"date":"2026-06-29","platform":"google","adSpend":600000,"impressions":212000,"clicks":1940,"conversions":33,"revenue":1320000},{"week":6,"date":"2026-07-06","platform":"google","adSpend":650000,"impressions":228000,"clicks":2150,"conversions":39,"revenue":1560000},{"week":7,"date":"2026-07-13","platform":"google","adSpend":700000,"impressions":244000,"clicks":2370,"conversions":45,"revenue":1800000},{"week":8,"date":"2026-07-20","platform":"google","adSpend":750000,"impressions":260000,"clicks":2600,"conversions":52,"revenue":2080000}];

const PLATFORMS = [
  { id: 'naver',  name: '네이버', color: '#14705c', desc: '검색광고' },
  { id: 'meta',   name: '메타',   color: '#a54a76', desc: '인스타 피드·릴스' },
  { id: 'google', name: '구글',   color: '#b8801a', desc: '디스플레이·리타겟팅' },
];
const ORDER = PLATFORMS.map(p => p.id);
const info = id => PLATFORMS.find(p => p.id === id) || { id, name: id, color: '#5a636e', desc: '' };

const withMetrics = r => ({
  ...r,
  ctr:  r.impressions ? r.clicks / r.impressions : 0,
  cvr:  r.clicks ? r.conversions / r.clicks : 0,
  roas: r.adSpend ? r.revenue / r.adSpend : 0,
  cpc:  r.clicks ? r.adSpend / r.clicks : 0,
  cac:  r.conversions ? r.adSpend / r.conversions : 0,
});

// 주차는 저장된 값이 아니라 date에서 계산한다 (React 쪽 lib/metrics.js의 deriveWeeks와 동일한 계산).
const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
const deriveWeeks = rows => {
  if (rows.length === 0) return [];
  const minTime = Math.min(...rows.map(r => new Date(r.date).getTime()));
  return rows.map(r => ({
    ...r,
    week: Math.floor((new Date(r.date).getTime() - minTime) / WEEK_MS) + 1,
    product: r.product || '전체',
  }));
};

const aggregate = rows => {
  const s = rows.reduce((a, r) => ({
    adSpend: a.adSpend + r.adSpend, impressions: a.impressions + r.impressions,
    clicks: a.clicks + r.clicks, conversions: a.conversions + r.conversions,
    revenue: a.revenue + r.revenue,
  }), { adSpend: 0, impressions: 0, clicks: 0, conversions: 0, revenue: 0 });
  return withMetrics(s);
};

const byPlatform = rows => PLATFORMS.map(p => {
  const subset = rows.filter(r => r.platform === p.id);
  return { ...p, rows: subset, ...aggregate(subset) };
}).filter(p => p.rows.length > 0);

const won = n => Math.round(n).toLocaleString('ko-KR');
const pct = (n, d = 1) => (n * 100).toFixed(d);

const ALL = deriveWeeks(RAW.map(withMetrics));
const WEEKS = ALL.map(r => r.week);
const MIN_W = Math.min(...WEEKS), MAX_W = Math.max(...WEEKS);

/* ---------- 조회 조건: 한 곳에서만 바뀌고, 주소창과 동기화된다 ---------- */
const SORT_KEYS = ['week','platform','adSpend','impressions','clicks','conversions','revenue','ctr','cpc','cvr','roas'];
const DEFAULTS = { platform: 'all', from: null, to: null, sortKey: 'week', sortDir: 'asc' };

function readFromUrl() {
  const p = new URLSearchParams(location.search);
  const num = k => { const v = Number(p.get(k)); return p.get(k) !== null && Number.isFinite(v) ? v : null; };
  const sk = p.get('sort'), sd = p.get('dir');
  return {
    platform: p.get('platform') || DEFAULTS.platform,
    from: num('from'), to: num('to'),
    sortKey: SORT_KEYS.includes(sk) ? sk : DEFAULTS.sortKey,
    sortDir: (sd === 'asc' || sd === 'desc') ? sd : DEFAULTS.sortDir,
  };
}

function writeToUrl(s) {
  const p = new URLSearchParams();
  if (s.platform !== DEFAULTS.platform) p.set('platform', s.platform);
  if (s.from !== null) p.set('from', s.from);
  if (s.to !== null) p.set('to', s.to);
  if (s.sortKey !== DEFAULTS.sortKey) p.set('sort', s.sortKey);
  if (s.sortDir !== DEFAULTS.sortDir) p.set('dir', s.sortDir);
  const qs = p.toString();
  history.replaceState(null, '', qs ? location.pathname + '?' + qs : location.pathname);
}

let state = readFromUrl();
const setState = patch => { state = { ...state, ...patch }; writeToUrl(state); render(); };

function toggleSort(key) {
  if (!SORT_KEYS.includes(key)) return;
  if (state.sortKey === key) return setState({ sortDir: state.sortDir === 'asc' ? 'desc' : 'asc' });
  const textual = key === 'week' || key === 'platform';
  setState({ sortKey: key, sortDir: textual ? 'asc' : 'desc' });
}

function sortRows(rows, key, dir) {
  const sign = dir === 'desc' ? -1 : 1;
  const val = r => key === 'platform' ? ORDER.indexOf(r.platform) : r[key];
  return [...rows].sort((a, b) => {
    const av = val(a), bv = val(b);
    if (av !== bv) return (av < bv ? -1 : 1) * sign;
    if (a.week !== b.week) return a.week - b.week;
    return ORDER.indexOf(a.platform) - ORDER.indexOf(b.platform);
  });
}

/* ---------- 채널별 ROAS 막대 ---------- */
function barChart(data) {
  const W = 420, rowH = 52, padL = 60, padR = 54, padT = 8, axisH = 26;
  const H = padT + data.length * rowH + axisH, plotW = W - padL - padR;
  const maxVal = Math.max(5, ...data.map(d => d.roas)) * 1.08;
  const x = v => padL + (v / maxVal) * plotW;
  const ticks = [0,1,2,3,4,5].filter(t => t <= maxVal);
  const baseY = padT + data.length * rowH;

  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="채널별 ROAS 막대 그래프">`;
  ticks.forEach(t => { s += `<line x1="${x(t)}" y1="${padT}" x2="${x(t)}" y2="${baseY}" stroke="#e9edf0" stroke-width="1"/>`; });
  s += `<line x1="${x(1)}" y1="${padT-2}" x2="${x(1)}" y2="${baseY}" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>`;
  s += `<text x="${x(1)}" y="${baseY+17}" fill="#c0392b" font-size="9" text-anchor="middle" font-family="IBM Plex Mono, monospace">손익분기 100%</text>`;
  data.forEach((d, i) => {
    const barY = padT + i * rowH + rowH / 2 - 9;
    s += `<text x="${padL-10}" y="${barY+13}" text-anchor="end" font-size="12" fill="#14181f" font-family="IBM Plex Sans KR, sans-serif">${d.name}</text>`;
    s += `<rect x="${padL}" y="${barY}" width="${Math.max(1, x(d.roas)-padL)}" height="18" fill="${d.color}" rx="1"/>`;
    s += `<text x="${x(d.roas)+8}" y="${barY+13}" font-size="12" fill="#14181f" font-family="IBM Plex Mono, monospace" font-weight="500">${pct(d.roas,0)}%</text>`;
    s += `<text x="${padL}" y="${barY+33}" font-size="10" fill="#949da8" font-family="IBM Plex Sans KR, sans-serif">${d.desc}</text>`;
  });
  ticks.forEach(t => { if (t !== 1) s += `<text x="${x(t)}" y="${baseY+17}" text-anchor="middle" font-size="9" fill="#949da8" font-family="IBM Plex Mono, monospace">${t*100}%</text>`; });
  return s + '</svg>';
}

/* ---------- 광고비 비중 vs 매출 비중 ---------- */
function shareChart(data) {
  const totalSpend = data.reduce((a, d) => a + d.adSpend, 0);
  const totalRevenue = data.reduce((a, d) => a + d.revenue, 0);
  if (!totalSpend || !totalRevenue) return '';

  const W = 420, rowH = 56, barH = 12, gap = 3, padL = 60, padR = 54, padT = 8, axisH = 20;
  const H = padT + data.length * rowH + axisH, plotW = W - padL - padR;
  const x = v => padL + v * plotW;
  const ticks = [0, 0.25, 0.5, 0.75, 1];

  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="채널별 광고비 비중과 매출 비중 비교 막대 그래프">`;
  ticks.forEach(t => { s += `<line x1="${x(t)}" y1="${padT}" x2="${x(t)}" y2="${padT + data.length * rowH}" stroke="#e9edf0" stroke-width="1"/>`; });

  data.forEach((d, i) => {
    const spendShare = d.adSpend / totalSpend;
    const revenueShare = d.revenue / totalRevenue;
    const y = padT + i * rowH + rowH / 2 - (barH + gap);
    s += `<text x="${padL-10}" y="${y+barH+2}" text-anchor="end" font-size="12" fill="#14181f" font-family="IBM Plex Sans KR, sans-serif">${d.name}</text>`;
    s += `<rect x="${padL}" y="${y}" width="${Math.max(1, x(spendShare)-padL)}" height="${barH}" fill="#949da8" rx="1"/>`;
    s += `<text x="${x(spendShare)+6}" y="${y+barH-2}" font-size="9" fill="#5a636e" font-family="IBM Plex Mono, monospace">광고비 ${Math.round(spendShare*100)}%</text>`;
    s += `<rect x="${padL}" y="${y+barH+gap}" width="${Math.max(1, x(revenueShare)-padL)}" height="${barH}" fill="${d.color}" rx="1"/>`;
    s += `<text x="${x(revenueShare)+6}" y="${y+barH+gap+barH-2}" font-size="9" fill="#14181f" font-family="IBM Plex Mono, monospace" font-weight="500">매출 ${Math.round(revenueShare*100)}%</text>`;
  });

  ticks.forEach(t => { s += `<text x="${x(t)}" y="${padT + data.length * rowH + 15}" text-anchor="middle" font-size="9" fill="#949da8" font-family="IBM Plex Mono, monospace">${Math.round(t*100)}%</text>`; });
  return s + '</svg>';
}

/* ---------- 주차별 ROAS 추이 ---------- */
function lineChart(rows) {
  const weeks = [...new Set(rows.map(r => r.week))].sort((a,b) => a-b);
  const series = byPlatform(rows).map(p => ({
    id: p.id, name: p.name, color: p.color,
    points: weeks.map(w => { const hit = p.rows.find(r => r.week === w); return { week: w, roas: hit ? hit.roas : 0 }; }),
  }));
  const W = 560, H = 250, padL = 42, padR = 58, padT = 14, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxVal = Math.max(5, ...series.flatMap(s => s.points.map(p => p.roas))) * 1.08;
  const x = w => weeks.length === 1 ? padL + plotW / 2 : padL + ((w - weeks[0]) / (weeks.length - 1)) * plotW;
  const y = v => padT + plotH - (v / maxVal) * plotH;
  const grid = [0,1,2,3,4,5].filter(v => v <= maxVal);
  // 주차가 많아지면(1년치 등) 라벨이 겹치니 대략 13개를 넘지 않게 솎아내고, 마지막 주차는 항상 보여준다.
  const labelStep = Math.max(1, Math.ceil(weeks.length / 13));
  const labelWeeks = weeks.filter((w, i) => i % labelStep === 0 || i === weeks.length - 1);

  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="주차별 ROAS 추이 선 그래프">`;
  grid.forEach(v => {
    const be = v === 1;
    s += `<line x1="${padL}" y1="${y(v)}" x2="${padL+plotW}" y2="${y(v)}" stroke="${be?'#c0392b':'#e9edf0'}" stroke-width="1"${be?' stroke-dasharray="3 3"':''}/>`;
    s += `<text x="${padL-8}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="${be?'#c0392b':'#949da8'}" font-family="IBM Plex Mono, monospace">${v*100}%</text>`;
  });
  labelWeeks.forEach(w => { s += `<text x="${x(w)}" y="${H-10}" text-anchor="middle" font-size="9" fill="#949da8" font-family="IBM Plex Mono, monospace">${w}주</text>`; });
  series.forEach(sr => {
    const pts = sr.points.map(p => `${x(p.week)},${y(p.roas)}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${sr.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    sr.points.forEach(p => { s += `<circle cx="${x(p.week)}" cy="${y(p.roas)}" r="2.4" fill="${sr.color}"/>`; });
    const last = sr.points[sr.points.length-1];
    s += `<text x="${x(last.week)+8}" y="${y(last.roas)+3}" font-size="10" fill="${sr.color}" font-family="IBM Plex Sans KR, sans-serif" font-weight="600">${sr.name}</text>`;
  });
  return s + '</svg>';
}

const COLUMNS = [
  { key: 'week', label: '주차', left: true },
  { key: 'platform', label: '채널', left: true },
  { key: 'adSpend', label: '광고비', tip: '이 기간에 실제로 쓴 광고비' },
  { key: 'impressions', label: '노출수', tip: '광고가 사람들 화면에 보여진 횟수' },
  { key: 'clicks', label: '클릭수', tip: '광고를 클릭한 횟수' },
  { key: 'conversions', label: '전환수', tip: '클릭한 사람 중 실제로 구매까지 이어진 수' },
  { key: 'revenue', label: '매출', tip: '이 전환들로 발생한 매출' },
  { key: 'ctr', label: 'CTR', tip: '노출 대비 클릭 비율 (클릭수 ÷ 노출수). 광고가 얼마나 눈길을 끌었는지' },
  { key: 'cpc', label: '클릭단가', tip: '클릭 1번을 얻는 데 든 비용 (광고비 ÷ 클릭수)' },
  { key: 'cvr', label: '전환율', tip: '클릭 대비 구매 비율 (전환수 ÷ 클릭수). 들어온 사람이 얼마나 실제로 샀는지' },
  { key: 'roas', label: 'ROAS', tip: '광고비 대비 매출 비율 (매출 ÷ 광고비). 100%를 넘으면 광고비보다 매출이 많다는 뜻' },
];

/* ---------- 렌더 ---------- */
function render() {
  const lo = Math.min(Math.max(state.from ?? MIN_W, MIN_W), MAX_W);
  const hi = Math.max(Math.min(state.to ?? MAX_W, MAX_W), MIN_W);
  const rows = ALL.filter(r => (state.platform === 'all' || r.platform === state.platform) && r.week >= lo && r.week <= hi);

  const t = aggregate(rows);
  const plats = byPlatform(rows);
  const sorted = [...plats].sort((a,b) => b.roas - a.roas);
  const best = sorted[0], worst = sorted[sorted.length-1];
  const spendAll = rows.reduce((a,r) => a + r.adSpend, 0);
  const revAll = rows.reduce((a,r) => a + r.revenue, 0);
  const tableRows = sortRows(rows, state.sortKey, state.sortDir);

  const options = ['<option value="all">전체</option>']
    .concat(PLATFORMS.map(p => `<option value="${p.id}"${p.id===state.platform?' selected':''}>${p.name}</option>`)).join('');

  const span = Math.max(1, MAX_W - MIN_W);
  const posL = ((lo - MIN_W) / span) * 100;
  const posR = ((hi - MIN_W) / span) * 100;
  const isRecent4 = lo === MAX_W - 3 && hi === MAX_W;
  const isAllRange = lo === MIN_W && hi === MAX_W;
  const isDefault = state.platform === 'all' && state.from === null && state.to === null
    && state.sortKey === 'week' && state.sortDir === 'asc';

  const head = COLUMNS.map(c => {
    const on = state.sortKey === c.key;
    const caret = on ? (state.sortDir === 'asc' ? '▲' : '▼') : '▲';
    const label = c.tip ? `<span class="term term--below" data-tip="${c.tip}">${c.label}</span>` : c.label;
    return `<th class="${c.left?'left':''}" aria-sort="${on ? (state.sortDir==='asc'?'ascending':'descending') : 'none'}">
      <button type="button" class="sort-btn" data-sort="${c.key}">${label}<span class="caret ${on?'on':''}">${caret}</span></button></th>`;
  }).join('');

  const body = tableRows.map(r => {
    const c = info(r.platform);
    return `<tr>
      <td class="num">${r.week}</td>
      <td><span class="chip"><i style="background:${c.color}"></i>${c.name}</span></td>
      <td class="num">${won(r.adSpend)}</td>
      <td class="num">${won(r.impressions)}</td>
      <td class="num">${won(r.clicks)}</td>
      <td class="num">${won(r.conversions)}</td>
      <td class="num">${won(r.revenue)}</td>
      <td class="num">${pct(r.ctr,2)}%</td>
      <td class="num">${won(r.cpc)}</td>
      <td class="num">${pct(r.cvr,2)}%</td>
      <td class="num ${r.roas>=1?'pos':'neg'}">${pct(r.roas,0)}%</td>
    </tr>`;
  }).join('');

  const takeaway = (state.platform === 'all' && best && worst && best.id !== worst.id) ? `
    <section class="takeaway">
      <p class="eyebrow">읽어낸 것</p>
      <ol>
        <li><span class="idx">01</span><span><b>${best.name}</b>의 ROAS가 ${Math.round(best.roas*100)}%로 가장 높다. 검색은 이미 살 마음이 있는 사람이 들어오는 자리라 전환율이 다른 채널의 3–4배다.</span></li>
        <li><span class="idx">02</span><span><b>${worst.name}</b>는 클릭은 가장 많이 나오지만 구매로 이어지지 않는다. 이 구간 광고비의 ${Math.round(worst.adSpend/spendAll*100)}%를 쓰고 매출은 ${Math.round(worst.revenue/revAll*100)}%다.</span></li>
        <li><span class="idx">03</span><span><b>구글</b>은 주차가 지날수록 올라간다. 리타겟팅 대상이 쌓이는 채널이라 초반 숫자만 보고 껐다면 손해였을 구간이다.</span></li>
        <li><span class="idx">04</span><span><b>제안</b> — 메타 예산의 일부를 네이버로 옮기고, 메타는 예산을 줄이는 대신 소재를 교체해 클릭 이후의 이탈을 먼저 잡는다. 구글은 상승 추세이므로 유지한다.</span></li>
      </ol>
    </section>` : '';

  const cards = rows.length === 0 ? '' : `
    <div class="cards">
      <div class="card">
        <p class="card-label">총 광고비</p>
        <p class="card-value num">${won(t.adSpend)}<span class="unit">원</span></p>
        <p class="card-sub">매출 <span class="num">${won(t.revenue)}</span>원</p>
      </div>
      <div class="card">
        <p class="card-label"><span class="term" data-tip="광고비 대비 매출 비율 (매출 ÷ 광고비). 100%를 넘으면 광고비보다 매출이 많다는 뜻">ROAS</span></p>
        <p class="card-value num">${pct(t.roas,0)}<span class="unit">%</span></p>
        <p class="card-sub">광고비 1원당 <span class="num">${t.roas.toFixed(1)}</span>원 매출</p>
      </div>
      <div class="card">
        <p class="card-label"><span class="term" data-tip="클릭 대비 구매 비율 (전환수 ÷ 클릭수). 들어온 사람이 얼마나 실제로 샀는지">전환율</span></p>
        <p class="card-value num">${pct(t.cvr,2)}<span class="unit">%</span></p>
        <p class="card-sub">고객 1명 확보 <span class="num">${won(t.cac)}</span>원</p>
      </div>
    </div>`;

  const main = rows.length === 0 ? `<p class="state">선택한 조건에 해당하는 데이터가 없습니다. 조건을 넓혀보세요.</p>` : `
    <div class="panels">
      <section class="panel">
        <h2>채널별 ROAS</h2>
        <p class="hint">광고비 대비 매출. 어디에 예산을 더 쓸지 판단하는 기준.</p>
        ${barChart(plats)}
      </section>
      <section class="panel">
        <h2>주차별 ROAS 추이</h2>
        <p class="hint">같은 채널도 시간이 지나며 효율이 달라진다.</p>
        ${lineChart(rows)}
      </section>
      <section class="panel">
        <h2>광고비 비중 vs 매출 비중</h2>
        <p class="hint">두 막대 길이가 비슷할수록 예산과 성과가 균형 잡혀 있다는 뜻.</p>
        ${shareChart(plats)}
      </section>
    </div>

    <p class="eyebrow">원본 데이터 · ${tableRows.length}건</p>
    <div class="table-wrap">
      <table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
    </div>
    ${takeaway}`;

  document.getElementById('root').innerHTML = `
  <div class="shell">
    <header class="masthead">
      <div>
        <h1 class="wordmark">Campaign Insight</h1>
        <p class="masthead-meta">샘플: 루미에르 비타민C 세럼 런칭 캠페인 · <span>${lo}–${hi}주 / 전체 ${MAX_W}주</span></p>
      </div>
    </header>

    <div class="sticky-top">
      <div class="controls">
        <div class="control">
          <label for="platform">채널</label>
          <select id="platform">${options}</select>
        </div>

        <div class="control range-control">
          <label for="from">기간<span class="range-readout num">${lo}–${hi}주</span></label>
          <div class="range">
            <div class="range-track"></div>
            <div class="range-fill" style="left:${posL}%;right:${100-posR}%"></div>
            <input id="from" type="range" min="${MIN_W}" max="${MAX_W}" value="${lo}" aria-label="시작 주차" />
            <input id="to" type="range" min="${MIN_W}" max="${MAX_W}" value="${hi}" aria-label="종료 주차" />
          </div>
        </div>

        <div class="control preset-control">
          <button type="button" class="ghost ${isAllRange?'on':''}" data-preset="all">전체</button>
          <button type="button" class="ghost ${isRecent4?'on':''}" data-preset="4">최근 4주</button>
        </div>

        <div class="control action-control">
          <button type="button" class="ghost" id="copy">링크 복사</button>
          <button type="button" class="ghost" id="reset" ${isDefault?'disabled':''}>초기화</button>
        </div>
      </div>
      ${cards}
    </div>

    ${main}

    <p class="footnote">
      조회 조건은 주소에 저장됩니다. 링크를 복사해 보내면 상대방도 같은 화면을 봅니다.
      루미에르(LUMIÈRE)는 실존하지 않는 가상 브랜드이며, 모든 수치는 채널 특성을 반영해 직접 설계한
      가상 데이터입니다. 객단가 40,000원 가정 · 전체 광고비 ${won(ALL.reduce((a,r)=>a+r.adSpend,0))}원.
      이 파일은 React 앱의 화면을 그대로 옮긴 미리보기입니다.
    </p>
  </div>`;

  bind(lo, hi);
}

function bind(lo, hi) {
  document.getElementById('platform').onchange = e => setState({ platform: e.target.value });

  const setRange = (a, b) => setState({ from: Math.min(a,b), to: Math.max(a,b) });
  document.getElementById('from').oninput = e => setRange(Number(e.target.value), hi);
  document.getElementById('to').oninput = e => setRange(lo, Number(e.target.value));

  document.querySelectorAll('[data-preset]').forEach(btn => {
    btn.onclick = () => {
      const p = btn.dataset.preset;
      if (p === 'all') setState({ from: null, to: null });
      else setRange(Math.max(MIN_W, MAX_W - Number(p) + 1), MAX_W);
    };
  });

  document.querySelectorAll('[data-sort]').forEach(btn => {
    btn.onclick = () => toggleSort(btn.dataset.sort);
  });

  document.getElementById('reset').onclick = () => setState({ ...DEFAULTS });

  document.getElementById('copy').onclick = async (e) => {
    try {
      await navigator.clipboard.writeText(location.href);
      e.target.textContent = '복사됨';
      setTimeout(() => { e.target.textContent = '링크 복사'; }, 1600);
    } catch { e.target.textContent = '복사 실패'; }
  };
}

addEventListener('popstate', () => { state = readFromUrl(); render(); });
render();
</script>
</body>
</html>

  <title>Campaign Insight</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');

:root {
  --ink: #14181f;
  --ink-2: #5a636e;
  --ink-3: #949da8;
  --ground: #eceef1;
  --surface: #ffffff;
  --line: #dce1e6;
  --line-soft: #e9edf0;
  --naver: #14705c;
  --meta: #a54a76;
  --google: #b8801a;
  --breakeven: #c0392b;
  --radius: 3px;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--ground);
  color: var(--ink);
  font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.num {
  font-family: 'IBM Plex Mono', monospace;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

/* 용어 설명 툴팁: 마우스를 올리면 뜻이 뜬다 */
.term {
  position: relative;
  border-bottom: 1px dotted var(--ink-3);
  cursor: help;
}
.term::after {
  content: attr(data-tip);
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-bottom: 6px;
  width: max-content;
  max-width: 220px;
  background: var(--ink);
  color: #fff;
  padding: 8px 10px;
  border-radius: 0;
  font-family: 'IBM Plex Sans KR', sans-serif;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
  line-height: 1.5;
  text-align: left;
  white-space: normal;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s;
  z-index: 30;
}
.term:hover::after {
  opacity: 1;
}
/* 표 헤더는 위로 띄우면 .table-wrap의 overflow-x: auto에 가려 안 보인다. 아래로 띄운다. */
.term--below::after {
  bottom: auto;
  top: 100%;
  margin-bottom: 0;
  margin-top: 6px;
}

.shell {
  max-width: 1240px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

/* ---------- header ---------- */
.masthead {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--ink);
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-mark {
  display: block;
  width: 36px;
  height: 31px;
  flex: none;
  margin-bottom: 8px;
}
.wordmark {
  font-family: 'Bodoni Moda', serif;
  font-size: 30px;
  font-weight: 400;
  letter-spacing: 0.16em;
  line-height: 1;
  margin: 0 0 8px;
}

/* ---------- 조건·요약 카드 상단 고정 ---------- */
.sticky-top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--ground);
  border-bottom: 1px solid var(--line);
}

.controls-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
}
.controls-summary {
  font-size: 12px;
  color: var(--ink-2);
}

/* ---------- controls ---------- */
.controls {
  display: flex;
  align-items: flex-end;
  gap: 26px;
  flex-wrap: wrap;
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: none;
  padding: 16px 20px;
}
.control {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.control > label {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.range-readout {
  font-size: 12px;
  letter-spacing: 0;
  color: var(--ink);
  text-transform: none;
}
.control select {
  font-family: 'IBM Plex Sans KR', sans-serif;
  font-size: 13px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px 12px;
  min-width: 118px;
  cursor: pointer;
}
.control select:focus-visible,
.ghost:focus-visible,
.sort-btn:focus-visible,
.range input:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

.range-control { flex: 1 1 220px; min-width: 200px; }
.preset-control, .action-control { flex-direction: row; gap: 6px; align-items: center; }

.ghost {
  font-family: 'IBM Plex Sans KR', sans-serif;
  font-size: 12px;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px 12px;
  cursor: pointer;
}
.ghost:hover:not(:disabled) { border-color: var(--ink-3); color: var(--ink); }
.ghost.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.ghost:disabled { opacity: 0.4; cursor: default; }

/* dual range slider */
.range { position: relative; height: 22px; }
.range-track, .range-fill {
  position: absolute;
  top: 10px;
  height: 2px;
  pointer-events: none;
}
.range-track { left: 0; right: 0; background: var(--line); }
.range-fill { background: var(--ink); }

.range input[type='range'] {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 22px;
  margin: 0;
  background: none;
  -webkit-appearance: none;
  appearance: none;
  pointer-events: none;
}
.range input[type='range']::-webkit-slider-thumb {
  -webkit-appearance: none;
  pointer-events: auto;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--ink);
  cursor: grab;
}
.range input[type='range']::-moz-range-thumb {
  pointer-events: auto;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--ink);
  cursor: grab;
}
.range input[type='range']::-moz-range-track { background: none; }

/* ---------- section label ---------- */
.eyebrow {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.eyebrow::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}

/* ---------- cards ---------- */
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  margin: 20px 0 40px;
}
.card {
  background: var(--surface);
  padding: 22px 20px 20px;
}
.card-label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-2);
  margin: 0 0 12px;
}
.card-value {
  font-size: 30px;
  font-weight: 500;
  line-height: 1;
  margin: 0;
}
.card-value .unit {
  font-size: 15px;
  color: var(--ink-2);
  margin-left: 3px;
}
.card-sub {
  font-size: 12px;
  color: var(--ink-3);
  margin: 10px 0 0;
}

.metric-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 20px 0 16px;
}
.metric-toggle .hint {
  margin: 0 0 0 4px;
}

/* ---------- panels ---------- */
.panels {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  margin-bottom: 40px;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 22px 20px;
}
.panel h2 {
  font-size: 14px;
  font-weight: 600;
  margin: 0 0 4px;
}
.panel p.hint {
  font-size: 12px;
  color: var(--ink-3);
  margin: 0 0 18px;
}

/* ---------- table ---------- */
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--line);
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  white-space: nowrap;
}
thead th {
  text-align: right;
  padding: 0;
  border-bottom: 1px solid var(--ink);
  background: var(--surface);
}
thead th.left { text-align: left; }

.sort-btn {
  width: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  font-family: 'IBM Plex Sans KR', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-2);
  background: none;
  border: none;
  padding: 12px 14px;
  cursor: pointer;
}
thead th.left .sort-btn { justify-content: flex-start; }
.sort-btn:hover { color: var(--ink); }
.caret {
  font-size: 7px;
  line-height: 1;
  opacity: 0;
  transition: opacity 0.12s;
}
.caret.on { opacity: 1; color: var(--ink); }
.sort-btn:hover .caret { opacity: 0.45; }
.sort-btn:hover .caret.on { opacity: 1; }
tbody td {
  padding: 10px 14px;
  text-align: right;
  border-bottom: 1px solid var(--line-soft);
}
tbody td:first-child, tbody td:nth-child(2) { text-align: left; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #f7f9fa; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}
.chip i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}
.pos { color: var(--naver); }
.neg { color: var(--breakeven); }

.table-pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 14px;
  border-top: 1px solid var(--line-soft);
  font-size: 12px;
  color: var(--ink-2);
}

/* ---------- takeaway ---------- */
.takeaway {
  margin-top: 40px;
  border-top: 1px solid var(--ink);
  padding-top: 22px;
}
.takeaway ol {
  margin: 0;
  padding-left: 0;
  list-style: none;
  display: grid;
  gap: 14px;
}
.takeaway li {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 12px;
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.65;
}
.takeaway li b {
  color: var(--ink);
  font-weight: 600;
}
.takeaway .idx {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--ink-3);
  padding-top: 2px;
}

.state {
  padding: 60px 20px;
  text-align: center;
  color: var(--ink-2);
  font-size: 13px;
}

.scroll-top {
  position: fixed;
  right: 24px;
  bottom: 24px;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'IBM Plex Sans KR', sans-serif;
  font-size: 14px;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0;
  cursor: pointer;
}
.scroll-top:hover { border-color: var(--ink-3); color: var(--ink); }
.scroll-top:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .cards { grid-template-columns: 1fr; }
  .shell { padding: 28px 16px 60px; }
  .wordmark { font-size: 24px; }
  .brand-mark { width: 29px; height: 25px; }
  .brand { gap: 10px; }
  .controls { gap: 16px; }
  .control, .range-control { flex: 1 1 100%; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>

];
const PRODUCT_PALETTE = ['#3d5a80', '#8a6d3b', '#5c6b73', '#7a5195', '#4c7a5a', '#2f6690', '#996633'];
const LOSS_COLOR = '#c0392b';
const ORDER = PLATFORMS.map(p => p.id);
const info = id => PLATFORMS.find(p => p.id === id) || { id, name: id, color: '#5a636e', desc: '' };

const withMetrics = r => {
  const cogs = r.margin != null ? r.revenue * (1 - r.margin) : null;
  const profit = cogs != null ? r.revenue - cogs - r.adSpend : null;
  return {
    ...r,
    ctr:  r.impressions ? r.clicks / r.impressions : 0,
    cvr:  r.clicks ? r.conversions / r.clicks : 0,
    roas: r.adSpend ? r.revenue / r.adSpend : 0,
    cpc:  r.clicks ? r.adSpend / r.clicks : 0,
    cac:  r.conversions ? r.adSpend / r.conversions : 0,
    cogs, profit,
    roi: profit != null && r.adSpend ? profit / r.adSpend : null,
  };
};

// 주차는 저장된 값이 아니라 date에서 계산한다 (React 쪽 lib/metrics.js의 deriveWeeks와 동일한 계산).
const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
const deriveWeeks = rows => {
  if (rows.length === 0) return [];
  const minTime = Math.min(...rows.map(r => new Date(r.date).getTime()));
  return rows.map(r => ({
    ...r,
    week: Math.floor((new Date(r.date).getTime() - minTime) / WEEK_MS) + 1,
    product: r.product || '전체',
  }));
};

const aggregate = rows => {
  // 마진이 한 행이라도 없으면 이익·ROI·손익분기 재계산은 포기하고 ROAS 100%를 손익분기로 쓴다.
  const hasMargin = rows.length > 0 && rows.every(r => r.margin != null);
  const s = rows.reduce((a, r) => ({
    adSpend: a.adSpend + r.adSpend, impressions: a.impressions + r.impressions,
    clicks: a.clicks + r.clicks, conversions: a.conversions + r.conversions,
    revenue: a.revenue + r.revenue,
    cogs: a.cogs + (hasMargin ? r.revenue * (1 - r.margin) : 0),
  }), { adSpend: 0, impressions: 0, clicks: 0, conversions: 0, revenue: 0, cogs: 0 });

  const base = withMetrics(s);
  if (!hasMargin) return { ...base, cogs: null, profit: null, roi: null, breakevenRoas: 1 };

  const profit = s.revenue - s.cogs - s.adSpend;
  const blendedMargin = s.revenue ? 1 - s.cogs / s.revenue : 1;
  return {
    ...base,
    cogs: s.cogs, profit,
    roi: s.adSpend ? profit / s.adSpend : 0,
    breakevenRoas: blendedMargin > 0 ? 1 / blendedMargin : 1,
  };
};

const byPlatform = (rows, platformList = PLATFORMS) => platformList.map(p => {
  const subset = rows.filter(r => r.platform === p.id);
  return { ...p, rows: subset, ...aggregate(subset) };
}).filter(p => p.rows.length > 0);

const byProduct = (rows, products) => products.map((p, i) => {
  const subset = rows.filter(r => r.product === p);
  return { id: p, name: p, color: PRODUCT_PALETTE[i % PRODUCT_PALETTE.length], desc: '', rows: subset, ...aggregate(subset) };
}).filter(p => p.rows.length > 0);

/* ---------- 조회 조건: 한 곳에서만 바뀌고, 주소창과 동기화된다 ---------- */
const SORT_KEYS = ['week','date','platform','product','adSpend','impressions','clicks','conversions','revenue','ctr','cpc','cvr','roas','profit','roi'];
const DEFAULTS = { platform: 'all', product: 'all', from: null, to: null, sortKey: 'week', sortDir: 'asc' };

function readFromUrl() {
  const p = new URLSearchParams(location.search);
  const num = k => { const v = Number(p.get(k)); return p.get(k) !== null && Number.isFinite(v) ? v : null; };
  const sk = p.get('sort'), sd = p.get('dir');
  return {
    platform: p.get('platform') || DEFAULTS.platform,
    product: p.get('product') || DEFAULTS.product,
    from: num('from'), to: num('to'),
    sortKey: SORT_KEYS.includes(sk) ? sk : DEFAULTS.sortKey,
    sortDir: (sd === 'asc' || sd === 'desc') ? sd : DEFAULTS.sortDir,
  };
}

function writeToUrl(s) {
  const p = new URLSearchParams();
  if (s.platform !== DEFAULTS.platform) p.set('platform', s.platform);
  if (s.product !== DEFAULTS.product) p.set('product', s.product);
  if (s.from !== null) p.set('from', s.from);
  if (s.to !== null) p.set('to', s.to);
  if (s.sortKey !== DEFAULTS.sortKey) p.set('sort', s.sortKey);
  if (s.sortDir !== DEFAULTS.sortDir) p.set('dir', s.sortDir);
  const qs = p.toString();
  history.replaceState(null, '', qs ? location.pathname + '?' + qs : location.pathname);
}

let state = readFromUrl();
// ROI ↔ ROAS 전환과 표 페이지는 주소에 안 남긴다(React 쪽과 동일 — 조건이라기보다 화면 보기 방식이라).
let metricView = 'roas';
let controlsOpen = true;
let showScrollTop = false;
let page = 0;
const PAGE_SIZE = 50;
const setState = patch => { state = { ...state, ...patch }; page = 0; writeToUrl(state); render(); };

function toggleSort(key) {
  if (!SORT_KEYS.includes(key)) return;
  if (state.sortKey === key) return setState({ sortDir: state.sortDir === 'asc' ? 'desc' : 'asc' });
  const textual = key === 'week' || key === 'date' || key === 'platform';
  setState({ sortKey: key, sortDir: textual ? 'asc' : 'desc' });
}

function sortRows(rows, key, dir) {
  const sign = dir === 'desc' ? -1 : 1;
  const val = r => key === 'platform' ? ORDER.indexOf(r.platform) : r[key];
  return [...rows].sort((a, b) => {
    const av = val(a), bv = val(b);
    if (av !== bv) return (av < bv ? -1 : 1) * sign;
    if (a.week !== b.week) return a.week - b.week;
    return ORDER.indexOf(a.platform) - ORDER.indexOf(b.platform);
  });
}

/* ---------- 채널별/제품별 ROAS·ROI 막대 (범용 — CompareBarChart.jsx와 동일 로직) ---------- */
function barChart(data, metric, breakevenValue) {
  metric = metric || 'roas'; breakevenValue = breakevenValue == null ? 1 : breakevenValue;
  // 왼쪽 이름표 여백은 가장 긴 이름에 맞춰 늘어난다 (긴 제품명이 잘리지 않게).
  const maxNameLen = Math.max(0, ...data.map(d => d.name.length));
  const W = 420, rowH = 52, padL = Math.max(60, 20 + maxNameLen * 12), padR = 54, padT = 8, axisH = 26;
  const H = padT + data.length * rowH + axisH, plotW = W - padL - padR;

  const values = data.map(d => d[metric]);
  const floor = metric === 'roas' ? 5 : 0.5;
  const rawMax = Math.max(floor, breakevenValue, ...values);
  const rawMin = Math.min(0, breakevenValue, ...values);
  const span = rawMax - rawMin || 1;
  const maxVal = rawMax + span * 0.08;
  const minVal = rawMin - (rawMin < 0 ? span * 0.08 : 0);

  const x = v => padL + ((v - minVal) / (maxVal - minVal)) * plotW;
  const zeroX = x(0);
  const baseY = padT + data.length * rowH;

  const tickStep = metric === 'roas' ? 1 : 0.5;
  const ticks = [];
  for (let t = Math.ceil(minVal / tickStep) * tickStep; t <= maxVal + 1e-9; t += tickStep) ticks.push(Math.round(t * 1000) / 1000);

  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:760px;height:auto;display:block" role="img" aria-label="${metric === 'roas' ? 'ROAS' : 'ROI'} 비교 막대 그래프">`;
  ticks.forEach(t => { s += `<line x1="${x(t)}" y1="${padT}" x2="${x(t)}" y2="${baseY}" stroke="#e9edf0" stroke-width="1"/>`; });
  s += `<line x1="${x(breakevenValue)}" y1="${padT-2}" x2="${x(breakevenValue)}" y2="${baseY}" stroke="${LOSS_COLOR}" stroke-width="1" stroke-dasharray="3 3"/>`;
  s += `<text x="${x(breakevenValue)}" y="${baseY+17}" fill="${LOSS_COLOR}" font-size="9" text-anchor="middle" font-family="IBM Plex Mono, monospace">손익분기 ${pct(breakevenValue,0)}%</text>`;

  data.forEach((d, i) => {
    const v = d[metric];
    const barY = padT + i * rowH + rowH / 2 - 9;
    const barX = Math.min(zeroX, x(v));
    const barW = Math.max(1, Math.abs(x(v) - zeroX));
    const negative = v < 0;
    const labelX = negative ? Math.max(padL + 22, zeroX - 8) : x(v) + 8;
    s += `<text x="${padL-10}" y="${barY+13}" text-anchor="end" font-size="12" fill="#14181f" font-family="IBM Plex Sans KR, sans-serif">${d.name}</text>`;
    s += `<rect x="${barX}" y="${barY}" width="${barW}" height="18" fill="${negative ? LOSS_COLOR : d.color}" rx="1"/>`;
    s += `<text x="${labelX}" y="${barY+13}" font-size="12" fill="#14181f" text-anchor="${negative?'end':'start'}" font-family="IBM Plex Mono, monospace" font-weight="500">${pct(v,0)}%</text>`;
    if (d.desc) s += `<text x="${padL}" y="${barY+33}" font-size="10" fill="#949da8" font-family="IBM Plex Sans KR, sans-serif">${d.desc}</text>`;
  });

  ticks.forEach(t => {
    if (Math.abs(x(t) - x(breakevenValue)) < 34) return;
    s += `<text x="${x(t)}" y="${baseY+17}" text-anchor="middle" font-size="9" fill="#949da8" font-family="IBM Plex Mono, monospace">${Math.round(t*100)}%</text>`;
  });
  return s + '</svg>';
}

/* ---------- 광고비 비중 vs 매출 비중 ---------- */
function shareChart(data) {
  const totalSpend = data.reduce((a, d) => a + d.adSpend, 0);
  const totalRevenue = data.reduce((a, d) => a + d.revenue, 0);
  if (!totalSpend || !totalRevenue) return '';

  const W = 420, rowH = 56, barH = 12, gap = 3, padL = 60, padR = 54, padT = 8, axisH = 20;
  const H = padT + data.length * rowH + axisH, plotW = W - padL - padR;
  const x = v => padL + v * plotW;
  const ticks = [0, 0.25, 0.5, 0.75, 1];

  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:760px;height:auto;display:block" role="img" aria-label="채널별 광고비 비중과 매출 비중 비교 막대 그래프">`;
  ticks.forEach(t => { s += `<line x1="${x(t)}" y1="${padT}" x2="${x(t)}" y2="${padT + data.length * rowH}" stroke="#e9edf0" stroke-width="1"/>`; });

  data.forEach((d, i) => {
    const spendShare = d.adSpend / totalSpend;
    const revenueShare = d.revenue / totalRevenue;
    const y = padT + i * rowH + rowH / 2 - (barH + gap);
    s += `<text x="${padL-10}" y="${y+barH+2}" text-anchor="end" font-size="12" fill="#14181f" font-family="IBM Plex Sans KR, sans-serif">${d.name}</text>`;
    s += `<rect x="${padL}" y="${y}" width="${Math.max(1, x(spendShare)-padL)}" height="${barH}" fill="#949da8" rx="1"/>`;
    s += `<text x="${x(spendShare)+6}" y="${y+barH-2}" font-size="9" fill="#5a636e" font-family="IBM Plex Mono, monospace">광고비 ${Math.round(spendShare*100)}%</text>`;
    s += `<rect x="${padL}" y="${y+barH+gap}" width="${Math.max(1, x(revenueShare)-padL)}" height="${barH}" fill="${d.color}" rx="1"/>`;
    s += `<text x="${x(revenueShare)+6}" y="${y+barH+gap+barH-2}" font-size="9" fill="#14181f" font-family="IBM Plex Mono, monospace" font-weight="500">매출 ${Math.round(revenueShare*100)}%</text>`;
  });

  ticks.forEach(t => { s += `<text x="${x(t)}" y="${padT + data.length * rowH + 15}" text-anchor="middle" font-size="9" fill="#949da8" font-family="IBM Plex Mono, monospace">${Math.round(t*100)}%</text>`; });
  return s + '</svg>';
}

// 플랫폼별 주차 시계열 (metrics.js의 trendByPlatform과 동일 로직). 차트와 '읽어낸 것' 추세 판정 둘 다 이걸 쓴다.
function trendByPlatform(rows, platformList) {
  const weeks = [...new Set(rows.map(r => r.week))].sort((a,b) => a-b);
  const series = byPlatform(rows, platformList).map(p => ({
    id: p.id, name: p.name, color: p.color,
    // 한 주차엔 여러 날 × 여러 제품의 행이 들어 있다. 그중 한 행을 집어 쓰면 안 되고,
    // 그 주차 전체의 광고비·매출을 먼저 합산한 뒤 비율을 낸다.
    // 그 주에 광고를 아예 안 돌렸으면 0%가 아니라 '값 없음'(null) — 그래프가 선을 끊는다.
    points: weeks.map(w => {
      const weekRows = p.rows.filter(r => r.week === w);
      if (weekRows.length === 0) return { week: w, roas: null, roi: null };
      const a = aggregate(weekRows);
      return { week: w, roas: a.roas, roi: a.roi ?? 0 };
    }),
  }));
  return { weeks, series };
}

/* ---------- 주차별 ROAS·ROI 추이 (TrendLineChart.jsx와 동일 로직) ---------- */
function lineChart(trendData, metric, breakevenValue) {
  metric = metric || 'roas'; breakevenValue = breakevenValue == null ? 1 : breakevenValue;
  const { weeks, series } = trendData;
  const W = 560, H = 250, padL = 42, padR = 58, padT = 14, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  // 값이 없는 주차(광고를 안 돌린 기간)는 축 범위 계산에서 뺀다.
  const values = series.flatMap(s => s.points.map(p => p[metric])).filter(v => v != null);
  const floor = metric === 'roas' ? 5 : 0.5;
  const rawMax = Math.max(floor, breakevenValue, ...values);
  const rawMin = Math.min(0, breakevenValue, ...values);
  const span = rawMax - rawMin || 1;
  const maxVal = rawMax + span * 0.08;
  const minVal = rawMin - (rawMin < 0 ? span * 0.08 : 0);

  const x = w => weeks.length === 1 ? padL + plotW / 2 : padL + ((w - weeks[0]) / (weeks.length - 1)) * plotW;
  const y = v => padT + plotH - ((v - minVal) / (maxVal - minVal)) * plotH;

  const tickStep = metric === 'roas' ? 1 : 0.5;
  const gridVals = [];
  for (let v = Math.ceil(minVal / tickStep) * tickStep; v <= maxVal + 1e-9; v += tickStep) gridVals.push(Math.round(v * 1000) / 1000);

  // 주차가 많아지면(90일치 등) 라벨이 겹치니 대략 13개를 넘지 않게 솎아내고, 마지막 주차는 항상 보여준다.
  const labelStep = Math.max(1, Math.ceil(weeks.length / 13));
  const labelWeeks = weeks.filter((w, i) => i % labelStep === 0 || i === weeks.length - 1);

  const cid = 'lc' + Math.random().toString(36).slice(2, 9);

  let s = `<svg id="${cid}" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:980px;height:auto;display:block" role="img" aria-label="주차별 ${metric === 'roas' ? 'ROAS' : 'ROI'} 추이 선 그래프">`;
  gridVals.forEach(v => {
    s += `<line x1="${padL}" y1="${y(v)}" x2="${padL+plotW}" y2="${y(v)}" stroke="#e9edf0" stroke-width="1"/>`;
    const label = Math.abs(y(v) - y(breakevenValue)) < 10 ? '' : `${Math.round(v*100)}%`;
    s += `<text x="${padL-8}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="#949da8" font-family="IBM Plex Mono, monospace">${label}</text>`;
  });
  s += `<line x1="${padL}" y1="${y(breakevenValue)}" x2="${padL+plotW}" y2="${y(breakevenValue)}" stroke="${LOSS_COLOR}" stroke-width="1" stroke-dasharray="3 3"/>`;
  s += `<text x="${padL-8}" y="${y(breakevenValue)+3}" text-anchor="end" font-size="9" fill="${LOSS_COLOR}" font-family="IBM Plex Mono, monospace">${pct(breakevenValue,0)}%</text>`;
  labelWeeks.forEach(w => { s += `<text x="${x(w)}" y="${H-10}" text-anchor="middle" font-size="9" fill="#949da8" font-family="IBM Plex Mono, monospace">${w}주</text>`; });
  series.forEach(sr => {
    // 값이 없는 주차에서 선을 끊는다 — 광고를 쉰 구간을 0%로 이어 그리면 "완전히 실패한 주"처럼 보인다.
    const segments = []; let cur = [];
    sr.points.forEach(p => {
      if (p[metric] == null) { if (cur.length) segments.push(cur); cur = []; }
      else cur.push(p);
    });
    if (cur.length) segments.push(cur);
    const shown = sr.points.filter(p => p[metric] != null);
    if (!shown.length) return;   // 조건에 걸려 데이터가 하나도 없는 채널
    segments.forEach(seg => {
      const pts = seg.map(p => `${x(p.week)},${y(p[metric])}`).join(' ');
      s += `<polyline points="${pts}" fill="none" stroke="${sr.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    });
    shown.forEach(p => { s += `<circle cx="${x(p.week)}" cy="${y(p[metric])}" r="2.4" fill="${sr.color}"/>`; });
    // 이름표는 그 채널의 마지막 '실제 데이터가 있는' 점 옆에 붙는다
    const last = shown[shown.length-1];
    s += `<text x="${x(last.week)+8}" y="${y(last[metric])+3}" font-size="10" fill="${sr.color}" font-family="IBM Plex Sans KR, sans-serif" font-weight="600">${sr.name}</text>`;
  });

  // 마우스를 올리면 가장 가까운 점 하나만 짚어서 정확한 수치를 보여준다
  // (그 주차의 모든 채널을 한꺼번에 보여주면 지금 보고 싶은 점이 뭔지 헷갈린다).
  // 요소를 미리 숨겨서 그려두고, mousemove 때 좌표만 옮긴다(전체 화면을 다시 그리지 않는다).
  const tipW = 96, tipH = 34;
  s += `<rect class="hoverArea" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent"/>`;
  s += `<g class="hoverGroup" style="display:none">`;
  s += `<circle class="hoverDot" r="4.5" stroke="#fff" stroke-width="1.5"/>`;
  s += `<rect class="hoverTip" width="${tipW}" height="${tipH}" fill="#14181f" rx="2"/>`;
  s += `<text class="hoverTipName" font-size="10" font-family="IBM Plex Sans KR, sans-serif" font-weight="600"></text>`;
  s += `<text class="hoverTipValue" font-size="10" fill="#fff" font-family="IBM Plex Mono, monospace"></text>`;
  s += `</g></svg>`;

  const bindHover = () => {
    const svg = document.getElementById(cid);
    if (!svg) return;
    const hoverArea = svg.querySelector('.hoverArea');
    const hoverGroup = svg.querySelector('.hoverGroup');
    const dot = svg.querySelector('.hoverDot');
    const tip = svg.querySelector('.hoverTip');
    const nameText = svg.querySelector('.hoverTipName');
    const valueText = svg.querySelector('.hoverTipValue');

    const update = (clientX, clientY) => {
      const rect = svg.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const mx = ((clientX - rect.left) / rect.width) * W;
      const my = ((clientY - rect.top) / rect.height) * H;

      let best = null, bestDist = Infinity;
      series.forEach((sr, si) => {
        sr.points.forEach((p, pi) => {
          if (p[metric] == null) return;   // 값 없는 주차는 마우스로 잡히지 않는다
          const dx = x(p.week) - mx, dy = y(p[metric]) - my;
          const d = dx * dx + dy * dy;
          if (d < bestDist) { bestDist = d; best = { si, pi }; }
        });
      });
      if (!best) return;

      const sr = series[best.si];
      const p = sr.points[best.pi];
      const px = x(p.week), py = y(p[metric]);

      hoverGroup.style.display = '';
      dot.setAttribute('cx', px);
      dot.setAttribute('cy', py);
      dot.setAttribute('fill', sr.color);

      const tipX = (px + 10 + tipW > W - 4) ? px - 10 - tipW : px + 10;
      const tipY = (py - tipH - 10 < padT) ? py + 12 : py - tipH - 10;
      tip.setAttribute('x', tipX);
      tip.setAttribute('y', tipY);
      nameText.setAttribute('x', tipX + 8);
      nameText.setAttribute('y', tipY + 14);
      nameText.setAttribute('fill', sr.color);
      nameText.textContent = sr.name;
      valueText.setAttribute('x', tipX + 8);
      valueText.setAttribute('y', tipY + 27);
      valueText.textContent = `${p.week}주 · ${pct(p[metric], 0)}%`;
    };

    hoverArea.addEventListener('mousemove', e => update(e.clientX, e.clientY));
    hoverArea.addEventListener('mouseleave', () => { hoverGroup.style.display = 'none'; });
  };

  return { svg: s, bindHover };
}

// '읽어낸 것' 문단은 채널 이름을 하드코딩한 문장이 아니라, 정형 진단 공식(funnelDiagnosis·
// trendDirection, React 쪽 metrics.js와 동일)이 내놓은 분류를 문장으로 바꾸는 표다.
const FUNNEL_TEXT = {
  'both-high': '노출부터 구매까지 전 구간이 평균보다 강하다.',
  'ctr-high-cvr-low': '클릭은 평균보다 잘 나오지만, 클릭 이후 전환은 평균보다 약하다 — 랜딩페이지나 타겟팅을 점검할 지점이다.',
  'ctr-low-cvr-high': '클릭은 평균보다 적지만, 일단 들어온 사람은 확실히 산다 — 이미 살 마음이 있는 트래픽일 가능성이 높다.',
  'both-low': '클릭도 전환도 평균을 밑돈다.',
  'mixed': '',
};

// 구간을 앞뒤로 나눠 평균을 비교해 추세를 판단한다. threshold(기본 10%) 밑이면 '보합'으로 본다.
function trendDirection(points, metric, threshold = 0.1) {
  // 광고를 안 돌린 주차(값 없음)는 추세 판단에서 제외한다.
  points = points.filter(p => p[metric] != null);
  if (points.length < 4) return { dir: 'flat', change: 0 };
  const mid = Math.floor(points.length / 2);
  const avg = arr => arr.reduce((a, p) => a + p[metric], 0) / arr.length;
  const first = avg(points.slice(0, mid));
  const second = avg(points.slice(mid));
  if (first === 0) return { dir: 'flat', change: 0 };
  const change = (second - first) / Math.abs(first);
  if (change > threshold) return { dir: 'up', change };
  if (change < -threshold) return { dir: 'down', change };
  return { dir: 'flat', change };
}

// CTR·CVR을 전체 평균과 비교해 퍼널 어디가 강하고 약한지 네 가지로 분류한다.
function funnelDiagnosis(ctr, cvr, avgCtr, avgCvr, margin = 0.15) {
  const ctrHigh = avgCtr > 0 && ctr > avgCtr * (1 + margin);
  const ctrLow = avgCtr > 0 && ctr < avgCtr * (1 - margin);
  const cvrHigh = avgCvr > 0 && cvr > avgCvr * (1 + margin);
  const cvrLow = avgCvr > 0 && cvr < avgCvr * (1 - margin);
  if (ctrHigh && cvrHigh) return 'both-high';
  if (ctrHigh && cvrLow) return 'ctr-high-cvr-low';
  if (ctrLow && cvrHigh) return 'ctr-low-cvr-high';
  if (ctrLow && cvrLow) return 'both-low';
  return 'mixed';
}

      <span class="num">${pageStart+1}–${Math.min(pageStart+PAGE_SIZE, tableRows.length)} / ${tableRows.length}건</span>
      <button type="button" class="ghost" id="pageNext" ${page>=pageCount-1?'disabled':''}>다음</button>
    </div>`;

  const trendText = trendPick
    ? `<b>${trendPick.name}</b>은 주차가 지날수록 ${trendPick.dir === 'up' ? '오르고' : '떨어지고'} 있다. ${trendPick.dir === 'up' ? '초반 숫자만 보고 껐다면 손해였을 구간이다.' : '이대로면 갈수록 효율이 나빠질 채널이다.'}`
    : '이 구간 동안 채널별 순위가 크게 바뀌지 않았다 — 지금 배분을 유지해도 무방하다.';
  const proposalText = `<b>제안</b> — ${worst?.name} 예산의 일부를 ${best?.name}로 옮긴다${worstBelowBreakeven ? `. ${worst.name}는 지금 손익분기 밑이라 조정이 시급하다` : ''}. ${worst?.name}는 예산을 줄이는 대신 소재를 교체해 클릭 이후의 이탈을 먼저 잡는다.`
    + (trendPick && trendPick.dir === 'up' ? ` ${trendPick.name}은 상승 추세이므로 유지한다.` : '')
    + (trendPick && trendPick.dir === 'down' ? ` ${trendPick.name}은 하락 추세이니 함께 점검한다.` : '');

  const takeaway = showTakeaway ? `
    <section class="takeaway">
      <p class="eyebrow">읽어낸 것</p>
      <ol>
        <li><span class="idx">01</span><span><b>${best.name}</b>의 ROAS가 ${Math.round(best.roas*100)}%로 가장 높다. ${FUNNEL_TEXT[funnelDiagnosis(best.ctr, best.cvr, t.ctr, t.cvr)]}</span></li>
        <li><span class="idx">02</span><span><b>${worst.name}</b>는 이 구간 광고비의 ${Math.round(worst.adSpend/spendAll*100)}%를 쓰고 매출은 ${Math.round(worst.revenue/revAll*100)}%다. ${FUNNEL_TEXT[funnelDiagnosis(worst.ctr, worst.cvr, t.ctr, t.cvr)]}</span></li>
        <li><span class="idx">03</span><span>${trendText}</span></li>
        <li><span class="idx">04</span><span>${proposalText}</span></li>
      </ol>
    </section>` : '';

  const cards = rows.length === 0 ? '' : `
    <div class="cards">
      <div class="card">
        <p class="card-label">총 광고비</p>
        <p class="card-value num">${won(t.adSpend)}<span class="unit">원</span></p>
        <p class="card-sub">매출 <span class="num">${won(t.revenue)}</span>원</p>
      </div>
      <div class="card">
        <p class="card-label"><span class="term" data-tip="광고비 대비 매출 비율 (매출 ÷ 광고비). 100%를 넘으면 광고비보다 매출이 많다는 뜻">ROAS</span></p>
        <p class="card-value num">${pct(t.roas,0)}<span class="unit">%</span></p>
        <p class="card-sub">광고비 1원당 <span class="num">${t.roas.toFixed(1)}</span>원 매출</p>
      </div>
      <div class="card">
        <p class="card-label"><span class="term" data-tip="클릭 대비 구매 비율 (전환수 ÷ 클릭수). 들어온 사람이 얼마나 실제로 샀는지">전환율</span></p>
        <p class="card-value num">${pct(t.cvr,2)}<span class="unit">%</span></p>
        <p class="card-sub">고객 1명 확보 <span class="num">${won(t.cac)}</span>원</p>
      </div>
    </div>`;

  const metricToggle = !showMetricToggle ? '' : `
    <div class="metric-toggle">
      <button type="button" class="ghost ${metricView==='roas'?'on':''}" data-metric="roas">ROAS</button>
      <button type="button" class="ghost ${metricView==='roi'?'on':''}" data-metric="roi">ROI</button>
      <span class="hint">${metricView==='roas' ? '광고비 대비 매출 비율' : '원가까지 뺀, 실제로 남는 이익 기준'}</span>
    </div>`;

  const productPanel = !showProduct ? '' : `
    <section class="panel">
      <h2>제품별 ${metricLabel}</h2>
      <p class="hint">어느 제품이 예산을 더 받을 자격이 있는지 판단하는 기준.</p>
      ${barChart(productData, metric, breakevenValue)}
    </section>`;

  const trend = lineChart(trendData, metric, breakevenValue);

  const main = rows.length === 0 ? `<p class="state">선택한 조건에 해당하는 데이터가 없습니다. 조건을 넓혀보세요.</p>` : `
    ${metricToggle}
    <div class="panels">
      <section class="panel">
        <h2>채널별 ${metricLabel}</h2>
        <p class="hint">${metric==='roas' ? '광고비 대비 매출. 어디에 예산을 더 쓸지 판단하는 기준.' : '원가까지 뺀 실제 수익성. 마이너스면 팔수록 손해라는 뜻.'}</p>
        ${barChart(plats, metric, breakevenValue)}
      </section>
      <section class="panel">
        <h2>주차별 ${metricLabel} 추이</h2>
        <p class="hint">같은 채널도 시간이 지나며 효율이 달라진다. 점에 마우스를 올리면 정확한 수치가 뜬다.</p>
        ${trend.svg}
      </section>
      ${productPanel}
      <section class="panel">
        <h2>광고비 비중 vs 매출 비중</h2>
        <p class="hint">두 막대 길이가 비슷할수록 예산과 성과가 균형 잡혀 있다는 뜻.</p>
        ${shareChart(plats)}
      </section>
    </div>

    <p class="eyebrow">원본 데이터 · ${tableRows.length}건</p>
    <div class="table-wrap">
      <table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
      ${pagination}
    </div>
    ${takeaway}`;

  document.getElementById('root').innerHTML = `
  <div class="shell">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 60 52" aria-hidden="true">
          <line x1="4" y1="44" x2="56" y2="44" stroke="var(--line)" stroke-width="1"/>
          <line x1="4" y1="22" x2="56" y2="22" stroke="var(--breakeven)" stroke-width="2"/>
          <rect x="10" y="10" width="8" height="34" fill="var(--naver)"/>
          <rect x="26" y="26" width="8" height="18" fill="var(--meta)"/>
          <rect x="42" y="16" width="8" height="28" fill="var(--google)"/>
        </svg>
        <h1 class="wordmark">Campaign Insight</h1>
      </div>
    </header>

    <div class="sticky-top">
      <div class="controls-bar">
        <span class="controls-summary num">
          ${state.platform === 'all' ? '전체 채널' : info(state.platform).name} ·
          ${safeProduct === 'all' ? '전체 제품' : safeProduct} ·
          ${lo}–${hi}주
        </span>
        <button type="button" class="ghost" id="toggleControls">${controlsOpen ? '조건 접기' : '조건 펼치기'}</button>
      </div>

      ${controlsOpen ? `<div class="controls">
        <div class="control">
          <label for="platform">채널</label>
          <select id="platform">${platformOptions}</select>
        </div>

        ${showProduct ? `<div class="control">
          <label for="product">제품</label>
          <select id="product">${productOptions}</select>
        </div>` : ''}

        <div class="control range-control">
          <label for="from">기간<span class="range-readout num">${lo}–${hi}주</span></label>
          <div class="range">
            <div class="range-track"></div>
            <div class="range-fill" style="left:${posL}%;right:${100-posR}%"></div>
            <input id="from" type="range" min="${MIN_W}" max="${MAX_W}" value="${lo}" aria-label="시작 주차" />
            <input id="to" type="range" min="${MIN_W}" max="${MAX_W}" value="${hi}" aria-label="종료 주차" />
          </div>
        </div>

        <div class="control preset-control">
          <button type="button" class="ghost ${isAllRange?'on':''}" data-preset="all">전체</button>
          <button type="button" class="ghost ${isRecent4?'on':''}" data-preset="4">최근 4주</button>
        </div>

        <div class="control action-control">
          <button type="button" class="ghost" id="copy">링크 복사</button>
          <button type="button" class="ghost" id="reset" ${isDefault?'disabled':''}>초기화</button>
        </div>
      </div>` : ''}
    </div>

    ${cards}

    ${main}

  </div>
  <button type="button" class="scroll-top" id="scrollTopBtn" aria-label="맨 위로" style="display:${showScrollTop?'flex':'none'}">↑</button>`;

  bind(lo, hi);
  trend.bindHover();
}

function bind(lo, hi) {
  document.getElementById('toggleControls').onclick = () => { controlsOpen = !controlsOpen; render(); };
  document.getElementById('scrollTopBtn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

  const platformEl = document.getElementById('platform');
  if (platformEl) platformEl.onchange = e => setState({ platform: e.target.value });

  const productEl = document.getElementById('product');
  if (productEl) productEl.onchange = e => setState({ product: e.target.value });

  const setRange = (a, b) => setState({ from: Math.min(a,b), to: Math.max(a,b) });
  const fromEl = document.getElementById('from');
  if (fromEl) fromEl.oninput = e => setRange(Number(e.target.value), hi);
  const toEl = document.getElementById('to');
  if (toEl) toEl.oninput = e => setRange(lo, Number(e.target.value));

  document.querySelectorAll('[data-preset]').forEach(btn => {
    btn.onclick = () => {
      const p = btn.dataset.preset;
      if (p === 'all') setState({ from: null, to: null });
      else setRange(Math.max(MIN_W, MAX_W - Number(p) + 1), MAX_W);
    };
  });

  document.querySelectorAll('[data-sort]').forEach(btn => {
    btn.onclick = () => toggleSort(btn.dataset.sort);
  });

  document.querySelectorAll('[data-metric]').forEach(btn => {
    btn.onclick = () => { metricView = btn.dataset.metric; render(); };
  });

  const pagePrev = document.getElementById('pagePrev');
  if (pagePrev) pagePrev.onclick = () => { page = Math.max(0, page - 1); render(); };
  const pageNext = document.getElementById('pageNext');
  if (pageNext) pageNext.onclick = () => { page += 1; render(); };

  const resetEl = document.getElementById('reset');
  if (resetEl) resetEl.onclick = () => setState({ ...DEFAULTS });

  const copyEl = document.getElementById('copy');
  if (copyEl) copyEl.onclick = async (e) => {
    try {
      await navigator.clipboard.writeText(location.href);
      e.target.textContent = '복사됨';
      setTimeout(() => { e.target.textContent = '링크 복사'; }, 1600);
    } catch { e.target.textContent = '복사 실패'; }
  };
}

addEventListener('popstate', () => { state = readFromUrl(); render(); });
addEventListener('scroll', () => {
  // 맨 위로 스크롤을 올리면 조건을 다시 볼 확률이 높으니 자동으로 펼친다.
  if (scrollY <= 4 && !controlsOpen) { controlsOpen = true; render(); return; }
  // 표가 1,800건이라 스크롤이 길어서, 어느 정도 내려가면 맨 위로 버튼을 보여준다.
  // 버튼 하나만 직접 토글한다 — 스크롤마다 전체 화면을 다시 그리면 느려진다.
  const next = scrollY > 400;
  if (next !== showScrollTop) {
    showScrollTop = next;
    const btn = document.getElementById('scrollTopBtn');
    if (btn) btn.style.display = showScrollTop ? 'flex' : 'none';
  }
}, { passive: true });
render();
</script>
</body>
</html>
